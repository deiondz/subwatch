[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subwatch"
version = "0.2.0"
description = "A command-line tool for certificate-derived subdomain discovery and reachability checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13,<15",
  "cryptography>=43,<47",
  "publicsuffix2>=2.20191221",
]

[project.scripts]
subwatch = "subwatch.app:main"
subwatch-ct = "subwatch.openct:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/subwatch"]
