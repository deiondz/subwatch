[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subwatch"
version = "0.1.0"
description = "A terminal UI for certificate-derived subdomain discovery and reachability checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "textual>=0.80,<2",
]

[project.scripts]
subwatch = "subwatch.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/subwatch"]
