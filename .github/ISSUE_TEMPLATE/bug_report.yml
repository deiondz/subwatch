name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: markdown
    attributes:
      value: Please remove domains, addresses, or output you cannot share publicly.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest commands or steps that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python and Subwatch versions
    validations:
      required: true
  - type: dropdown
    id: authorization
    attributes:
      label: Target authorization
      options:
        - I own the target or have permission to assess it
        - No live target is involved
    validations:
      required: true
